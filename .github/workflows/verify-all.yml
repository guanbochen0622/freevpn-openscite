name: Verify installed reader and live website
on:
  push:
    paths: ['.github/workflows/verify-all.yml', 'workspace.css', 'app.js', 'desktop/assistant.cjs', 'reader-tools.js', 'workspace.js', 'index.html', 'locales/**', 'tests/**', 'i18n.js', 'pdf-text.js']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-and-live-site:
    strategy:
      fail-fast: false
      matrix:
        pass: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check && node --check reader-tools.js && node --check i18n.js
      - run: npm run test:logic && node tests/reader-lifecycle.cjs && node tests/partial-index.cjs && node tests/locales.cjs && node tests/pdf-text.cjs && node tests/sources.cjs
      - name: Test local website
        run: npm test
      - name: Wait for the tested stylesheet to reach GitHub Pages
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          (async()=>{const assets=['workspace.css','app.js','index.html','reader-tools.js','workspace.js','i18n.js','locales/ui.tsv','pdf-text.js'],deadline=Date.now()+180000;
          while(Date.now()<deadline){const matches=await Promise.all(assets.map(async file=>{const r=await fetch('https://guanbochen0622.github.io/freevpn-openscite/'+file+'?verify='+Date.now());return r.ok&&(await r.text())===fs.readFileSync(file,'utf8');}));if(matches.every(Boolean)){console.log('Deployed assets match checked-out version');return;}await new Promise(r=>setTimeout(r,3000));}throw Error('GitHub Pages has not published the tested assets yet');})().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Test deployed website with controlled source and AI responses
        run: npm test
        env:
          TEST_URL: https://guanbochen0622.github.io/freevpn-openscite/
      - name: Search real bibliographic services from the deployed website
        run: node tests/live-services.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-website-screenshots-${{ matrix.pass }}
          path: /tmp/openscite-*.png
  native-mac:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
        pass: [1, 2]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:window
