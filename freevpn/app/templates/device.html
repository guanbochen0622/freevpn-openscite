<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{device.name}} · FreeVPN</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="device-page"><a class="back" href="/">← 返回 FreeVPN</a><section class="panel"><div class="device-header"><span class="eyebrow">WIREGUARD DEVICE</span><h1>{{device.name}}</h1><p>{{device.ip}} · 掃描 QR Code 即可匯入 WireGuard</p></div><div class="qr-card"><img src="/device/{{device.name}}/qr" alt="WireGuard QR"><div class="qr-label">{{device.name}} · {{device.ip}}</div></div><div class="device-actions"><a class="btn" href="/device/{{device.name}}/config">下載 .conf</a><a class="btn ghost" href="/">完成</a><form method="post" action="/device/{{device.name}}/delete" onsubmit="return confirm('確定刪除這台裝置？')"><input type="hidden" name="csrf" value="{{csrf}}"><button class="btn danger" type="submit">刪除裝置</button></form></div><details class="config"><summary>查看 WireGuard 設定內容</summary><pre>{{config}}</pre></details></section><div class="notice"><b>私鑰保護</b><span>此頁包含裝置 WireGuard 私鑰設定。請不要分享 QR Code、設定檔或頁面截圖給不可信任的人。</span></div></div></body></html>
